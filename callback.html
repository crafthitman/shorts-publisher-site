<!doctype html><html lang="en"><head><title>Connected - Shorts Publisher</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f7f5f0;--fg:#1f1b18;--muted:#5d5650;--card:#fff;--line:#e4ded5;--acc:#c2622d}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--fg:#f1ece6;--muted:#b3aaa1;--card:#1f1c19;--line:#34302b;--acc:#e8894f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
nav{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;margin-bottom:32px}nav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--acc)}
h1{font-size:32px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:32px 0 8px}p,li{color:var(--fg)}.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:20px 0}
a{color:var(--acc)}code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}
footer{margin-top:48px;font-size:14px;color:var(--muted)}
</style></head><body><main><nav><a href="./">Home</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a></nav>
<h1 id="t">Connecting your account&hellip;</h1>
<div class="card" id="box"><p class="muted">Reading the response from TikTok&hellip;</p></div>
<script>
(function(){
  var q = new URLSearchParams(location.search), box = document.getElementById('box'), t = document.getElementById('t');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if (q.get('error')) {
    t.textContent = 'Connection was not completed';
    box.innerHTML = '<p>TikTok returned: <code>' + esc(q.get('error')) + '</code></p><p class="muted">' + esc(q.get('error_description') || '') + '</p>';
  } else if (q.get('code')) {
    t.textContent = 'Almost done';
    box.innerHTML = '<p>Your account approved the connection. Copy this one-time code and paste it where the setup asks for it. It expires in a few minutes and can be used only once.</p>'
      + '<p><code id="c">' + esc(q.get('code')) + '</code></p><p><button id="b">Copy code</button></p>'
      + (q.get('state') ? '<p class="muted">Account: ' + esc(q.get('state')) + '</p>' : '');
    document.getElementById('b').onclick = function(){ navigator.clipboard.writeText(q.get('code')); this.textContent = 'Copied'; };
  } else {
    t.textContent = 'Shorts Publisher login page';
    box.innerHTML = '<p>This page receives the response when the owner connects a TikTok account to Shorts Publisher. There is nothing to do here directly.</p>';
  }
})();
</script>
<footer>Shorts Publisher &middot; Contact: <a href="mailto:crafthitman@gmail.com">crafthitman@gmail.com</a></footer></main></body></html>
